name: Repair PREFLIGHT Activity Dashboard

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/audit-preflight-today.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Bind dashboard elements explicitly
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const file = 'src/server.js';
          let text = fs.readFileSync(file, 'utf8');
          const from = "<script>let mode='real',last=null;function esc";
          const bindings = "<script>let mode='real',last=null;const byId=id=>document.getElementById(id);const updated=byId('updated'),pcalls=byId('pcalls'),punique=byId('punique'),pmcp=byId('pmcp'),pchecks=byId('pchecks'),pallreal=byId('pallreal'),pworldcallers=byId('pworldcallers'),pconvertedall=byId('pconvertedall'),pdemocalls=byId('pdemocalls'),ocalls=byId('ocalls'),ounique=byId('ounique'),omcp=byId('omcp'),oapi=byId('oapi'),strangerMilestones=byId('strangerMilestones'),feedTitle=byId('feedTitle'),realBtn=byId('realBtn'),allBtn=byId('allBtn'),feed=byId('feed');function esc";
          if (!text.includes(from)) {
            if (text.includes("const byId=id=>document.getElementById(id)")) {
              console.log('Dashboard already repaired');
              process.exit(0);
            }
            throw new Error('Expected dashboard script marker not found');
          }
          text = text.replace(from, bindings);
          fs.writeFileSync(file, text);
          NODE

      - name: Test
        run: npm test

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No repair needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          git commit -m "fix: bind activity dashboard elements explicitly"
          git push origin HEAD:main
